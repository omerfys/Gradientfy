      try {
        var savedView = sessionStorage.getItem('gradientfy_current_view');
        if (!savedView || savedView === 'catalog') {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
        }
      } catch (e) {}
