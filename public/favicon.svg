<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Liquid Golden-Amber Gradient -->
    <linearGradient id="gradGoldLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde6" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Inset Sheen -->
    <linearGradient id="gradGoldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.6)" />
      <stop offset="100%" stop-color="rgba(217, 119, 6, 0.2)" />
    </linearGradient>
  </defs>

  <!-- Milled Dark Container Badge with subtle highlight border -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="#080c16" stroke="url(#gradGoldBorder)" stroke-width="1.5" />

  <!-- Pure Geometric Gradient "G" Ribbon -->
  <path 
    d="M32 14 C27 9, 14 9, 11 19 C8 29, 17 38, 28 38 C35 38, 38 34, 38 28 L25 28" 
    stroke="url(#gradGoldLogo)" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>
